# AERC 保守版本 Docker Compose 配置
# 使用已驗證的套件版本確保服務穩定性

version: '3.8'

services:
  api:
    build: 
      context: ./api
      dockerfile: Dockerfile.conservative
    image: aerc-api:conservative
    container_name: aerc-api-conservative
    ports:
      - "5002:5000"  # 使用不同端口避免衝突
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/aerc
    volumes:
      - ./api/src:/app/src  # 開發時可選的即時代碼更新
    restart: unless-stopped

  db:
    build: ./db
    image: aerc-db
    container_name: aerc-db-conservative
    ports:
      - "5434:5432"  # 使用不同端口避免衝突
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aerc
    volumes:
      - aerc_postgres_data_conservative:/var/lib/postgresql/data
    restart: unless-stopped

  dry-farm:
    build: ./dry-farm
    image: aerc-dry-farm
    container_name: aerc-dry-farm-conservative
    ports:
      - "3002:3000"  # 使用不同端口避免衝突
    depends_on:
      - api
    restart: unless-stopped

volumes:
  aerc_postgres_data_conservative:
