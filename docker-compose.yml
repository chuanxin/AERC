name: aerc

services:

  api:
    build: ./api
    ports:
      - 5001:5000
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - TZ=Asia/Taipei
      # Email SMTP 設定
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_STARTTLS=${MAIL_STARTTLS}
      - MAIL_SSL_TLS=${MAIL_SSL_TLS}
      - USE_CREDENTIALS=${USE_CREDENTIALS}
      - VALIDATE_CERTS=${VALIDATE_CERTS}
      - FRONTEND_URL=${FRONTEND_URL}
      - EMAIL_VERIFICATION_EXPIRE_HOURS=${EMAIL_VERIFICATION_EXPIRE_HOURS}
      - PASSWORD_RESET_EXPIRE_HOURS=${PASSWORD_RESET_EXPIRE_HOURS}
      - AUTH_PRIVATE_KEY_PEM=${AUTH_PRIVATE_KEY_PEM}
      - AUTH_PUBLIC_KEY_KID=${AUTH_PUBLIC_KEY_KID}
    volumes:
      - ./api:/app
      - ./data:/app/data
      - /app/bin
      - /app/include
      - /app/lib
    command: uvicorn src.main:app --reload --host 0.0.0.0 --port 5000
    depends_on:
      - db

  dry-farm:
    build: ./dry-farm
    environment:
      - FAST_API_BASE_URL=${FAST_API_BASE_URL}
      - FAST_API_TARGET=${FAST_API_TARGET}
      - FAST_API_VERSION=${FAST_API_VERSION}
      - VITE_STEP2_OFFLINE_TRAINING=${VITE_STEP2_OFFLINE_TRAINING}
      - VITE_STEP2_OFFLINE_SECTIONS=${VITE_STEP2_OFFLINE_SECTIONS}
    volumes:
      - './dry-farm:/app'
      - '/app/node_modules'
    ports:
      - 3001:3000
    depends_on:
      -  api

  db:
    build: ./db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=Asia/Taipei
      - PGTZ=Asia/Taipei
    command: >
      postgres
      -c timezone='Asia/Taipei'
      -c log_timezone='Asia/Taipei'
    volumes:
      - pg17_data:/var/lib/postgresql/data
    ports:
      - 5433:5432

volumes:
  pg17_data:
  