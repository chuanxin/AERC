[project]
name = "auction-api"
version = "0.1.0"
description = "Online Auction Platform API"
requires-python = ">=3.12"

[tool.aerich]
tortoise_orm = "src.database.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
