repos:
  - repo: local
    hooks:
      - id: no-exception-detail-leak
        name: "[安全] HTTPException 4xx detail 不得含例外變數"
        language: python
        entry: python api/scripts/check_exception_detail.py
        files: ^api/src/(routes|crud)/.*\.py$
        pass_filenames: true
        additional_dependencies: []

      - id: schema-max-length-alignment
        name: "[安全] Pydantic str 欄位缺少 max_length（Schema Drift 風險）"
        language: python
        entry: python api/scripts/check_schema_max_length.py
        files: ^api/src/(schemas|routes|crud)/.*\.py$
        pass_filenames: true
        additional_dependencies: []

      # 掃全樹（重複是跨檔案的關係），但只回報牽涉到本次變更的組；
      # 既有已知重複記在 api/scripts/duplicate_functions_baseline.txt，不擋 commit
      - id: duplicate-function-bodies
        name: "[品質] 同一段邏輯被抄成第二份（結構相同、函式名不同）"
        language: python
        entry: python api/scripts/check_duplicate_functions.py
        files: ^api/src/.*\.py$
        pass_filenames: true
        additional_dependencies: []
